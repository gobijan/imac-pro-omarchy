# Written by imac-pro-omarchy (./install.sh cpu, docs/power.md). Turbo off at
# every boot: the Xeon W stays at or below its base clock, so short bursts of
# work no longer heat the package past the fan curve's start. Remove with
# ./install.sh cpu-stock.
w /sys/devices/system/cpu/intel_pstate/no_turbo - - - - 1
