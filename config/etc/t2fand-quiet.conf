# Read by /usr/local/bin/t2fanrd-quiet (docs/fans.md). Omarchy's defaults plus
# min_speed: the SMC's own minimum is 1100 rpm, both fans run steadily at 800.
[Fan1]
low_temp=55
high_temp=75
speed_curve=linear
always_full_speed=false
min_speed=800

[Fan2]
low_temp=55
high_temp=75
speed_curve=linear
always_full_speed=false
min_speed=800
