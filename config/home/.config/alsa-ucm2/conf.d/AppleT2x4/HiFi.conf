Include.pcm_split.File "/common/pcm/split.conf"

# hw channels: 0 = left woofer, 1 = right woofer, 2 = left tweeter,
# 3 = right tweeter. There is no hardware crossover; the PipeWire filter-chain
# in ~/.config/pipewire/pipewire.conf.d/imacpro-speakers.conf provides one, so
# this raw sink should not be used directly.
Macro.playback.SplitPCM {
	Name "apple_t2_speakers"
	Direction Playback
	Format S24_LE
	Channels 4
	HWChannels 4
	HWChannelPos0 FL
	HWChannelPos1 FR
	HWChannelPos2 RL
	HWChannelPos3 RR
}

Macro.capture.SplitPCM {
	Name "apple_t2_mics"
	Direction Capture
	Format S24_LE
	Channels 4
	HWChannels 4
	HWChannelPos0 FL
	HWChannelPos1 FR
	HWChannelPos2 RL
	HWChannelPos3 RR
}

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker drivers (raw, no crossover)"

	Value {
		PlaybackPriority 300
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "apple_t2_speakers"
		Direction Playback
		Device 0
		Channels 4
		HWChannels 4
		Channel0 0
		Channel1 1
		Channel2 2
		Channel3 3
		ChannelPos0 FL
		ChannelPos1 FR
		ChannelPos2 RL
		ChannelPos3 RR
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 300
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "apple_t2_mics"
		Direction Capture
		Device 1
		Channels 4
		HWChannels 4
		Channel0 0
		Channel1 1
		Channel2 2
		Channel3 3
		ChannelPos0 FL
		ChannelPos1 FR
		ChannelPos2 RL
		ChannelPos3 RR
	}
}

# No jack detection is available, so these rank below the internal devices
# and have to be selected by hand when something is plugged in.
SectionDevice."Headphones" {
	Comment "Headphones"

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},100"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	Value {
		CapturePriority 100
		CaptureChannels 1
		CapturePCM "hw:${CardId},100"
	}
}
