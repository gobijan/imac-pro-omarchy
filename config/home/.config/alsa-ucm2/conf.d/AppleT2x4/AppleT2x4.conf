Syntax 6

# Local override of apple-t2-audio-config for the iMac Pro (iMacPro1,1) with
# the t2bce_audio driver: PCM 0 = speakers (4ch), 1 = mic array (4ch),
# 100 = headphone jack codec (2ch out / 1ch in). There are no jack controls.
SectionUseCase."HiFi" {
	File "/conf.d/AppleT2x4/HiFi.conf"
	Comment "Apple T2 Audio"
}
